name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='deploy*.zip' --exclude='node_modules'
          path: ./
          remote_path: /home/puretego/public_html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Clear OLS cache and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Remove stale pre-compressed files
            find /home/puretego/public_html/ \( -name '*.br' -o -name '*.gz' \) -delete 2>/dev/null
            # Fix ownership and permissions
            chown -R nobody:nobody /home/puretego/public_html/
            find /home/puretego/public_html/ -type d -exec chmod 755 {} \;
            find /home/puretego/public_html/ -type f -exec chmod 644 {} \;
            # Clear OLS caches
            rm -rf /usr/local/lsws/swap/* 2>/dev/null
            rm -rf /home/puretego/lscache/* 2>/dev/null
            rm -rf /usr/local/lsws/gacc/lscache/* 2>/dev/null
            # Restart OpenLiteSpeed
            systemctl restart lsws
            echo "Deploy complete!"
